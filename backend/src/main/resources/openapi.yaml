openapi: 3.0.3
info:
  title: Life Management 2.0 API
  version: 0.0.1
security:
  - bearerAuth: []
paths:
  /api/health:
    $ref: 'openapi/paths/health.yaml'
  /api/sync/changes:
    $ref: 'openapi/paths/sync-changes.yaml'
  /api/auth/login:
    $ref: 'openapi/paths/auth-login.yaml'
  /api/auth/refresh:
    $ref: 'openapi/paths/auth-refresh.yaml'
  /api/auth/logout:
    $ref: 'openapi/paths/auth-logout.yaml'
  /api/admin/users:
    $ref: 'openapi/paths/admin-users.yaml'
  /api/admin/users/{username}/password:
    $ref: 'openapi/paths/admin-user-password.yaml'
  /api/profile:
    $ref: 'openapi/paths/profile.yaml'
  /api/profile/weight-history:
    $ref: 'openapi/paths/weight-history.yaml'
  /api/profile/weight-history/{id}:
    $ref: 'openapi/paths/weight-history-item.yaml'
  /api/gear-items:
    $ref: 'openapi/paths/gear-items.yaml'
  /api/gear-items/{id}:
    $ref: 'openapi/paths/gear-items-item.yaml'
  /api/packing-templates:
    $ref: 'openapi/paths/packing-templates.yaml'
  /api/packing-templates/{id}:
    $ref: 'openapi/paths/packing-templates-item.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminApiKey:
      type: apiKey
      in: header
      name: X-Admin-Api-Key
  schemas:
    ApiError:
      $ref: 'openapi/components/schemas/ApiError.yaml'
    HealthResponse:
      $ref: 'openapi/components/schemas/HealthResponse.yaml'
    SyncChangesResponse:
      $ref: 'openapi/components/schemas/SyncChangesResponse.yaml'
    SyncChangeItem:
      $ref: 'openapi/components/schemas/SyncChangeItem.yaml'
    LoginRequest:
      $ref: 'openapi/components/schemas/LoginRequest.yaml'
    AuthTokens:
      $ref: 'openapi/components/schemas/AuthTokens.yaml'
    RefreshRequest:
      $ref: 'openapi/components/schemas/RefreshRequest.yaml'
    AdminCreateUserRequest:
      $ref: 'openapi/components/schemas/AdminCreateUserRequest.yaml'
    AdminSetPasswordRequest:
      $ref: 'openapi/components/schemas/AdminSetPasswordRequest.yaml'
    AdminUser:
      $ref: 'openapi/components/schemas/AdminUser.yaml'
    UserProfile:
      $ref: 'openapi/components/schemas/UserProfile.yaml'
    WeightHistoryEntry:
      $ref: 'openapi/components/schemas/WeightHistoryEntry.yaml'
    WeightHistoryEntryList:
      $ref: 'openapi/components/schemas/WeightHistoryEntryList.yaml'
    GearItem:
      $ref: 'openapi/components/schemas/GearItem.yaml'
    GearItemList:
      $ref: 'openapi/components/schemas/GearItemList.yaml'
    PackingTemplate:
      $ref: 'openapi/components/schemas/PackingTemplate.yaml'
    PackingTemplateList:
      $ref: 'openapi/components/schemas/PackingTemplateList.yaml'
    PackingTemplateItem:
      $ref: 'openapi/components/schemas/PackingTemplateItem.yaml'
    PackingTemplateDetail:
      $ref: 'openapi/components/schemas/PackingTemplateDetail.yaml'
