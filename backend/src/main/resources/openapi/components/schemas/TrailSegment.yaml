type: object
description: >-
  backlog/tura-utvonaltervezo/104-... — shared/global turistaút-szakasz, OSM extract-importból
  származó referenciaadat (nem user-owned, nem szinkronizált entitás — lásd
  backlog/tura-utvonaltervezo/103-... 1. fázis terve: bbox-alapú REST lekérdezés, nem
  /api/sync/changes).
required:
  - id
  - countryCode
  - symbol
  - coordinates
properties:
  id:
    type: string
    format: uuid
  countryCode:
    type: string
    description: ISO 3166-1 alpha-2 országkód, pl. "HU".
  osmWayId:
    type: integer
    format: int64
    nullable: true
    description: Az eredeti OSM way azonosítója, ha az importforrás megadta.
  symbol:
    type: string
    description: 'MTSZ turistajelzés-típus, pl. PIROS_SAV, KEK_SAV, ZOLD_SAV, SARGA_SAV, PIROS_KERESZT, KEK_HAROMSZOG, EGYEB.'
  coordinates:
    type: array
    minItems: 2
    description: A szakasz vonalgeometriája, [lon, lat] pontsorozatként.
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
