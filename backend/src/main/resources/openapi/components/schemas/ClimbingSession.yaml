type: object
description: >-
  documentation/Features/Mászónapló.md — one logged climbing session with its ascent attempts and
  (outdoor multi-pitch only) pitch logs. documentation/Architektúra/Backend.md "Nested aggregate PUT":
  ClimbingSession + its AscentAttempt rows + their PitchLog rows are saved / read as one tree on every
  endpoint including the plain list — `attempts` (and each attempt's `pitches`) always lists every row,
  live or soft-deleted (the client filters `deleted = false` itself when rendering or summing). No
  kcal / body-weight / volume field: `activityExtraKcal` and the Volume stat are pure client
  calculations (documentation/Features/Tápérték kalkulátor.md). `locationType` + `discipline` are
  discriminator columns — one flat schema, the context-specific fields are all nullable and which
  apply to which context is enforced client-side (szerver oldalon laza).
required:
  - id
  - date
  - locationType
  - discipline
  - attempts
  - deleted
properties:
  id:
    type: string
    format: uuid
  date:
    type: string
    format: date
    description: Calendar date in the client's TZ — the aznapi activityExtraKcal bucket. Több session / nap OK.
  locationType:
    type: string
    enum:
      - INDOOR
      - OUTDOOR
    description: Dashboard discriminator (not a form choice). A session never mixes INDOOR + OUTDOOR.
  discipline:
    type: string
    enum:
      - BOULDER
      - ROPE
    description: Dashboard discriminator. A session never mixes BOULDER + ROPE.
  startedAt:
    type: string
    format: date-time
    nullable: true
    description: >-
      backlog/122 — wall-clock start of a live-recorded session ("Start session"); null for a post-hoc
      log. Editable on the end-of-session summary.
  endedAt:
    type: string
    format: date-time
    nullable: true
    description: >-
      backlog/122 — wall-clock end of a live-recorded session (defaults to when "Session vége" was
      tapped, editable on the summary); must not precede `startedAt` (400 VALIDATION). The client then
      stores `totalSessionDurationMinutes` = the rounded difference.
  totalSessionDurationMinutes:
    type: integer
    minimum: 1
    nullable: true
    description: >-
      Missing / invalid → the client's kcal preview falls back to logged-attempt-rows × 5 min (boulder)
      or × 15 min (rope); the server just stores what is sent.
  pumpRating:
    type: integer
    minimum: 1
    maximum: 5
    nullable: true
    description: Optional 1–5; a client-side kcal modifier on the active MET.
  headspaceRating:
    type: integer
    minimum: 1
    maximum: 5
    nullable: true
    description: Optional 1–5; statistics only.
  notes:
    type: string
    nullable: true
  climbingPartners:
    type: array
    nullable: true
    items:
      type: string
  weatherConditions:
    type: array
    items:
      type: string
      enum:
        - HOT
        - MILD
        - COLD
        - DRY
        - HUMID
        - WINDY
        - RAIN
        - WET_ROCK
        - SUNNY
        - SHADE
    description: >-
      backlog/119 — outdoor sessions only. Any combination of atomic weather tags (contradicting
      ones too — conditions change during a long session); an empty / missing list means "not
      specified". The server always echoes a list (never null), de-duplicated in a canonical order.
  gymId:
    type: string
    format: uuid
    nullable: true
    description: 'Indoor context: → Gym (climbing/gyms). A soft link only; `gymName` is the snapshot.'
  gymName:
    type: string
    nullable: true
  cragId:
    type: string
    format: uuid
    nullable: true
    description: 'Outdoor context: → Crag (climbing/crags). Soft link; `cragName` is the snapshot.'
  cragName:
    type: string
    nullable: true
  attempts:
    type: array
    items:
      $ref: 'AscentAttempt.yaml'
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
