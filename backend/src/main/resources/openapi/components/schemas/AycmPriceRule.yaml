type: object
description: >-
  documentation/Subfeatures/AYCM elfogadóhely hozzáadása.md — one time-band price rule of a partner.
  The rule IS the opening hours: a half-open [startTime, endTime) window on the flagged weekdays.
  Live rules of the same partner that share a weekday must have disjoint intervals (checked on the
  client and the server). No midnight crossing — endTime may be "24:00" but never wraps.
  visitValueHuf = listPriceHuf; coPaymentHuf is snapshot metadata and never feeds the visit value.
required:
  - id
  - partnerId
  - appliesMon
  - appliesTue
  - appliesWed
  - appliesThu
  - appliesFri
  - appliesSat
  - appliesSun
  - startTime
  - endTime
  - listPriceHuf
  - coPaymentHuf
  - deleted
properties:
  id:
    type: string
    format: uuid
  partnerId:
    type: string
    format: uuid
  label:
    type: string
    nullable: true
    description: Optional. When blank, the display name falls back to "startTime–endTime".
  appliesMon:
    type: boolean
  appliesTue:
    type: boolean
  appliesWed:
    type: boolean
  appliesThu:
    type: boolean
  appliesFri:
    type: boolean
  appliesSat:
    type: boolean
  appliesSun:
    type: boolean
  startTime:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    description: '"HH:mm", 00:00..23:59.'
  endTime:
    type: string
    pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
    description: '"HH:mm", strictly after startTime, max "24:00".'
  listPriceHuf:
    type: integer
    minimum: 0
    description: Whole HUF. visitValueHuf of a matching Check-In equals this.
  coPaymentHuf:
    type: integer
    minimum: 0
    description: Whole HUF, default 0. Snapshot metadata only — never added to the visit value.
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
