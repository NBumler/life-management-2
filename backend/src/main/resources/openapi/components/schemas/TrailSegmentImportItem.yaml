type: object
required:
  - symbol
  - coordinates
properties:
  osmWayId:
    type: integer
    format: int64
    nullable: true
  symbol:
    type: string
  routeName:
    type: string
    nullable: true
    description: backlog/201 — az OSM reláció `name` tagje, ha van.
  coordinates:
    type: array
    minItems: 2
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
