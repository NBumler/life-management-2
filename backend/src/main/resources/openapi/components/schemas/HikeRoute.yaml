type: object
description: >-
  backlog/tura-utvonaltervezo/103-... 2.1 fázis — kézzel rajzolt, user-owned túraútvonal.
  Teljesen offline-szinkronizált (ellentétben a megosztott TrailSegment-tel).
required:
  - id
  - name
  - coordinates
  - deleted
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  coordinates:
    type: array
    minItems: 2
    description: Az útvonal vonalgeometriája, [lon, lat] pontsorozatként (waypointok, rajzolási sorrendben).
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
