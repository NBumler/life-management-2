type: object
description: >-
  backlog/tura-utvonaltervezo/103-... 2.1 fázis — kézzel rajzolt, user-owned túraútvonal.
  Teljesen offline-szinkronizált (ellentétben a megosztott TrailSegment-tel).
required:
  - id
  - name
  - coordinates
  - deleted
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  coordinates:
    type: array
    minItems: 2
    description: Az útvonal vonalgeometriája, [lon, lat] pontsorozatként (waypointok, rajzolási sorrendben).
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
  distanceMeters:
    type: number
    nullable: true
    description: >-
      backlog/tura-utvonaltervezo/103-... 2.3 fázis. A kliens tölti ki a /api/tura/route-metrics
      hívás eredményéből mentéskor; null, ha a metrika-számítás még nem történt meg (pl. az
      elevation API akkor nem volt elérhető) — a HikeRoute enélkül is menthető/szinkronizálható.
  elevationGainMeters:
    type: number
    nullable: true
  elevationLossMeters:
    type: number
    nullable: true
  estimatedDurationMinutes:
    type: number
    nullable: true
  elevationProfile:
    type: array
    nullable: true
    items:
      $ref: 'ElevationProfilePoint.yaml'
  days:
    type: array
    nullable: true
    description: >-
      backlog/tura-utvonaltervezo/103-... 2.4 fázis — szakaszokra bontás/éjszakázó pontok; üres
      vagy hiányzó tömb = egynapos túra (nincs szakaszokra bontva). Nem required, visszamenőleg
      kompatibilis a korábbi fázisokban mentett útvonalakkal, amiken nincs ez a mező.
    items:
      $ref: 'HikeRouteDay.yaml'
