type: object
description: >-
  backlog/121 — a per-meal override of one recipe ingredient's quantity on a RECIPE MealItem: the
  quantity actually used instead of the recipe's (the Recipe / RecipeIngredient rows never change).
  The item's `servings` multiplies it exactly like an untouched ingredient, so the effective amount
  is (override ?? recipe quantity) × servings — for macros, price and the stock deduction alike.
  No id and no own sync row: overrides only ever change together with their MealItem, so they are
  stored as a JSON array on the item (same pattern as HikeRoute.days). `foodId` is a snapshot, so an
  override keeps counting (flagged "recepten kívüli" in the UI) if the ingredient is later removed
  from the recipe. A quantity of 0 means the ingredient was left out.
required:
  - recipeIngredientId
  - foodId
  - quantityAmount
  - quantityUnit
properties:
  recipeIngredientId:
    type: string
    format: uuid
  foodId:
    type: string
    format: uuid
  quantityAmount:
    type: number
    minimum: 0
  quantityUnit:
    type: string
    description: 'documentation/Architektúra/Mennyiség mező.md quantity unit: cs, db, g, dkg, kg, l, dl, cl, or ml.'
