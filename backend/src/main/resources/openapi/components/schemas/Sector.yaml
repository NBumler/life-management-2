type: object
description: >-
  documentation/Subfeatures/Outdoor boulder admin.md — a user-owned sector under a Crag. `defaultAspect`
  is a free-text default wall orientation ("fekvés") inherited by routes and the outdoor napló. The
  crag link is fixed at create time.
required:
  - id
  - cragId
  - name
  - deleted
properties:
  id:
    type: string
    format: uuid
  cragId:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  defaultAspect:
    type: string
    nullable: true
    description: Free-text default aspect / wall orientation, inherited by routes and the napló.
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
