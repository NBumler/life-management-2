type: object
description: >-
  documentation/Subfeatures/Outdoor boulder admin.md — a user-owned sector under a Crag. `defaultAspect`
  is the default wall orientation ("fekvés") as an 8-wind compass token, inherited by routes and the
  outdoor napló. The crag link is fixed at create time.
required:
  - id
  - cragId
  - name
  - deleted
properties:
  id:
    type: string
    format: uuid
  cragId:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  defaultAspect:
    type: string
    nullable: true
    enum: [N, NE, E, SE, S, SW, W, NW]
    description: >-
      backlog/068 — default wall aspect ("fekvés") as an 8-wind compass token, inherited by routes
      and the outdoor napló. `null` = unknown / not given.
  defaultLengthInMeters:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
    nullable: true
    description: >-
      backlog/088 — optional default route length (metres). The rope napló uses it when a picked
      Route has no `lengthInMeters` of its own (order: Route → Sector default → manual). `null` = none.
      Shown on the shared sector editor but unused by the boulder napló.
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
