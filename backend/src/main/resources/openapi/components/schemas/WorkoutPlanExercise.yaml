type: object
description: >-
  documentation/Subfeatures/Heti terv.md "Entitás — WorkoutPlanExercise" — one exercise line in a
  template. `exerciseName` / `exerciseCategory` / `exerciseKind` are a SNAPSHOT taken at edit time
  (from the picker); a later rename or soft delete of the master exercise never rewrites them. Unlike
  WorkoutExerciseEntry, `exerciseId` is REQUIRED ("kötelező a sablonban"). Only ever saved nested
  inside a WorkoutPlan (documentation/Architektúra/Backend.md "Nested aggregate PUT"), but its own
  sync row. Enum values match Exercise.yaml's category/kind exactly (kept inline, as in
  WorkoutExerciseEntry.yaml).
required:
  - id
  - planId
  - exerciseId
  - exerciseName
  - exerciseCategory
  - exerciseKind
  - orderIndex
  - deleted
  - targetSets
properties:
  id:
    type: string
    format: uuid
  planId:
    type: string
    format: uuid
  exerciseId:
    type: string
    format: uuid
    description: '→ Gyakorlat master (exercise_catalog). Required in a template; a soft link (snapshot columns carry the display data).'
  exerciseName:
    type: string
    minLength: 1
  exerciseCategory:
    type: string
    enum:
      - CHEST
      - BACK
      - LEGS
      - SHOULDERS
      - ARMS
      - CORE
      - FOREARM_FINGERS
      - FULL_BODY
  exerciseKind:
    type: string
    enum:
      - WEIGHTED_REPS
      - BODYWEIGHT_REPS
      - ISOMETRIC_TIME
      - HANGBOARD_PINCH
      - CARDIO_TIME_DIST
    description: Snapshot of the master ExerciseKind — the target-set UI fields follow this.
  orderIndex:
    type: integer
  supersetGroup:
    type: integer
    nullable: true
    description: Same value = visual superset / round group (same rule as WorkoutExerciseEntry).
  targetSets:
    type: array
    items:
      $ref: 'WorkoutPlanSet.yaml'
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
