type: object
description: >-
  Admin upsert kérés (backlog/tura-utvonaltervezo/103-... 2.5 fázis, POST
  /api/admin/tura/curated-routes — X-Admin-Api-Key). Idempotens: a megadott id-re a teljes rekordot
  lecseréli. A táv/szint/idő-becslést a szerver maga számolja ki a coordinates-ból
  (RouteMetricsService) — az admin nem adja meg.
required:
  - id
  - name
  - difficulty
  - activityType
  - coordinates
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  description:
    type: string
    nullable: true
  difficulty:
    $ref: 'CuratedRouteDifficulty.yaml'
  activityType:
    $ref: 'CuratedRouteActivityType.yaml'
  coordinates:
    type: array
    minItems: 2
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
  days:
    type: array
    nullable: true
    items:
      $ref: 'HikeRouteDay.yaml'
