type: object
description: >-
  Admin upsert kérés (backlog/tura-utvonaltervezo/103-... 2.5 fázis, POST
  /api/admin/tura/curated-routes — X-Admin-Api-Key). Idempotens: a megadott id-re a teljes rekordot
  lecseréli. A távot a szerver mindig maga számolja ki a coordinates-ból. A szint- és időértékeket
  (backlog/217) az import a kliens algoritmusával (frontend core/geo/route-metrics.ts + a DEM build
  asset) számolja és küldi, így a katalógus és az átvett piszkozat ugyanazt mutatja; ha a három mező
  hiányzik, a szerver számolja (RouteMetricsService, Open-Meteo). Csak mind a három együtt adható meg.
required:
  - id
  - name
  - difficulty
  - activityType
  - coordinates
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  description:
    type: string
    nullable: true
  symbol:
    type: string
    nullable: true
    description: >-
      backlog/216 — a turistajelzés kódja, ugyanabban a `<SZÍN>_<ALAKZAT>` formátumban, mint a
      TrailSegment.symbol (`PIROS_SAV`, `KEK_KERESZT`, …); az OSM-reláció osmc:symbol tagjéből. null,
      ha a túrának nincs (ismert) jelzése.
  difficulty:
    $ref: 'CuratedRouteDifficulty.yaml'
  activityType:
    $ref: 'CuratedRouteActivityType.yaml'
  coordinates:
    type: array
    minItems: 2
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
  elevationGainMeters:
    type: number
    nullable: true
    minimum: 0
  elevationLossMeters:
    type: number
    nullable: true
    minimum: 0
  estimatedDurationMinutes:
    type: number
    nullable: true
    minimum: 0
  days:
    type: array
    nullable: true
    items:
      $ref: 'HikeRouteDay.yaml'
