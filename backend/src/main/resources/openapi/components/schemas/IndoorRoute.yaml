type: object
description: >-
  documentation/Subfeatures/Indoor köteles admin.md — an optional fixed indoor-route catalogue entry
  ("fix termi út katalógus"). `absoluteDifficultyIndex` comes from the client's matrix
  (documentation/Subfeatures/Nehézségi szint skálája (konverziós mátrix).md); the server stores,
  never recomputes it.
required:
  - id
  - gymId
  - name
  - discipline
  - grade
  - absoluteDifficultyIndex
  - deleted
properties:
  id:
    type: string
    format: uuid
  gymId:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  discipline:
    type: string
    enum:
      - BOULDER
      - ROPE
  grade:
    type: string
    minLength: 1
  absoluteDifficultyIndex:
    type: integer
  sector:
    type: string
    nullable: true
    description: Free-text sector / wall-strip label.
  topoNumber:
    type: string
    maxLength: 32
    nullable: true
    description: >-
      backlog/079 — optional guidebook / topo ordinal ("12", "5/a", "5b"). Gym-scoped, not unique.
      Clients order route pickers by a natural (numeric-prefix + letter) sort on this, falling back
      to name; the server never orders by it.
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
