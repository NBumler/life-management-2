type: object
description: >-
  documentation/Subfeatures/Outdoor boulder admin.md — an optional user-owned boulder problem master
  under a Sector ("Opcionális master"); the napló can also create ad-hoc problems without one.
  `guidebookGrade` is the raw guidebook string, parsed client-side (no matrix index column). The
  sector link is fixed at create time.
required:
  - id
  - sectorId
  - name
  - guidebookGrade
  - deleted
properties:
  id:
    type: string
    format: uuid
  sectorId:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  guidebookGrade:
    type: string
    minLength: 1
  topoNumber:
    type: string
    maxLength: 32
    nullable: true
    description: >-
      backlog/079 — optional guidebook / topo ordinal ("12", "5/a", "5b"). Sector-scoped, not
      unique. Clients order problem pickers by a natural (numeric-prefix + letter) sort on this,
      falling back to name; the server never orders by it.
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
