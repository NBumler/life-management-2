type: object
description: >-
  documentation/Subfeatures/Nyújtás.md (backlog/169) — one logged stretching session (live-guided or
  post-hoc). documentation/Architektúra/Backend.md "Nested aggregate PUT": StretchSession + its
  StretchSessionItem rows saved/read as one tree — `items` always lists every row, live or soft-deleted.
  A stretching session is never a load day (rest-day rules) and has no kcal column — the client computes
  the aznapi activityExtraKcal from `durationMinutes`.
required:
  - id
  - date
  - durationMinutes
  - deleted
  - items
properties:
  id:
    type: string
    format: uuid
  date:
    type: string
    format: date
    description: Calendar date in the client's TZ — the aznapi activityExtraKcal bucket.
  startTime:
    type: string
    pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    nullable: true
    description: 'HH:mm, 24h.'
  endTime:
    type: string
    pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    nullable: true
    description: 'HH:mm, 24h.'
  durationMinutes:
    type: integer
    minimum: 1
    maximum: 240
  stretchPlanId:
    type: string
    format: uuid
    nullable: true
    description: The stretching template it was started from (null = ad-hoc). 404 when not the caller's.
  workoutSessionId:
    type: string
    format: uuid
    nullable: true
    description: backlog/170 — the strength session this stretch followed (null = standalone). 404 when not the caller's.
  notes:
    type: string
    nullable: true
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
  items:
    type: array
    items:
      $ref: 'StretchSessionItem.yaml'
