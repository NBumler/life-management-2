type: object
description: documentation/Subfeatures/Sablonok.md — a named packing template, without its items (list view).
required:
  - id
  - name
  - deleted
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  notes:
    type: string
    nullable: true
  itemCount:
    type: integer
    format: int32
    description: >-
      documentation/Subfeatures/Sablonok.md — count of live PackingTemplateItem rows on this
      template, for the per-row display in the list view. Derived, read-only; not populated on the
      sync-changes feed.
    readOnly: true
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
