type: object
description: >-
  documentation/Subfeatures/Élet tervek.md — user-owned long-term life goal. Not unique by title
  (multiple identical titles allowed), not a Naptár producer in the MVP.
required:
  - id
  - title
  - status
  - deleted
properties:
  id:
    type: string
    format: uuid
  title:
    type: string
    minLength: 1
  notes:
    type: string
    nullable: true
  status:
    type: string
    enum:
      - PLANNED
      - IN_PROGRESS
      - DONE
  targetDate:
    type: string
    format: date
    nullable: true
    description: Client calendar day, list-display only — never emitted to Naptár.
  completedAt:
    type: string
    format: date-time
    nullable: true
    description: >-
      Client-computed side effect of a status change (set on any -> DONE, cleared on DONE -> other).
      Must be present iff status is DONE — the server rejects a contradicting pair with 400.
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
