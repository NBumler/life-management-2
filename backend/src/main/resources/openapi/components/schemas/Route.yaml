type: object
description: >-
  documentation/Subfeatures/Outdoor köteles admin.md — a user-owned rope route under a Sector.
  `guidebookGrade` is the raw guidebook string; the napló parses it, the server stores it verbatim
  (no matrix index column). `lengthInMeters` / `totalPitches` / `rockType` / `aspect` are optional
  prefill values for the rope napló — when `rockType` / `aspect` are set they win over the
  Sector/Crag default. The sector link is fixed at create time.
required:
  - id
  - sectorId
  - name
  - guidebookGrade
  - deleted
properties:
  id:
    type: string
    format: uuid
  sectorId:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  guidebookGrade:
    type: string
    minLength: 1
  lengthInMeters:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
    nullable: true
    description: Optional route length, prefills the napló's lengthInMeters.
  totalPitches:
    type: integer
    minimum: 1
    nullable: true
    description: Optional pitch count, prefills the napló.
  rockType:
    type: string
    nullable: true
    description: Optional per-route rock type; when set it wins over the Sector/Crag default.
  aspect:
    type: string
    nullable: true
    enum: [N, NE, E, SE, S, SW, W, NW]
    description: >-
      backlog/068 — optional per-route aspect as an 8-wind compass token; when set it wins over the
      Sector default in the napló. `null` = unknown / inherit.
  topoNumber:
    type: string
    maxLength: 32
    nullable: true
    description: >-
      backlog/079 — optional guidebook / topo ordinal ("12", "5/a", "5b"). Sector-scoped, not
      unique. Clients order route pickers by a natural (numeric-prefix + letter) sort on this,
      falling back to name; the server never orders by it.
  protectionType:
    type: string
    nullable: true
    enum: [BOLTED, TRAD, CLEAN, TOPROPE]
    description: >-
      backlog/118 — how the route is protected (a permanent property of the route, not of an
      attempt): BOLTED (sport), TRAD, CLEAN, TOPROPE (top-rope only). `null` = not specified. The
      rope napló prefills an attempt's `safetyStyle` from it (BOLTED → LEAD, TRAD/CLEAN → TRAD,
      TOPROPE → TOPROPE); the attempt value stays freely editable.
  deleted:
    type: boolean
  deletedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
