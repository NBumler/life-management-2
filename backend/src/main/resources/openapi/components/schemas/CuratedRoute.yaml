type: object
description: >-
  backlog/tura-utvonaltervezo/103-... 2.5 fázis — admin-szerkesztett vagy OSM-eredetű ajánlott túra.
  Kizárólag saját/admin tartalom, nem közösségi feltöltés (ld. archive/110-... dropped). Megosztott
  referenciaadat, mint a TrailSegment: nincs user_id, nincs deleted tombstone, nem az
  /api/sync/changes csatornán megy — a dedikált, szűrhető GET /api/tura/curated-routes listával
  érhető el.
required:
  - id
  - name
  - difficulty
  - activityType
  - coordinates
  - distanceMeters
  - elevationGainMeters
  - elevationLossMeters
  - estimatedDurationMinutes
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
  description:
    type: string
    nullable: true
  difficulty:
    $ref: 'CuratedRouteDifficulty.yaml'
  activityType:
    $ref: 'CuratedRouteActivityType.yaml'
  coordinates:
    type: array
    minItems: 2
    description: Az útvonal vonalgeometriája, [lon, lat] pontsorozatként.
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
  days:
    type: array
    nullable: true
    description: >-
      backlog/tura-utvonaltervezo/103-... — szakaszokra bontás/éjszakázó pontok többnapos ajánlott
      túrákhoz; üres vagy hiányzó tömb = egynapos túra. Ugyanaz a HikeRouteDay DTO, mint a felhasználó
      saját útvonalainál.
    items:
      $ref: 'HikeRouteDay.yaml'
  distanceMeters:
    type: number
    description: A szerver számolja ki (RouteMetricsService) admin upsertkor, a coordinates-ból.
  elevationGainMeters:
    type: number
  elevationLossMeters:
    type: number
  estimatedDurationMinutes:
    type: number
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
