parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  operationId: getClimbingRoute
  tags:
    - climbing-routes
  summary: A single route. Own deleted row returns 200 with deleted=true (not 404).
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Route.yaml'
    '404':
      description: No such route (or it belongs to another user).
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
put:
  operationId: updateClimbingRoute
  tags:
    - climbing-routes
  summary: Full update (last-write-wins).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/Route.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Route.yaml'
    '409':
      description: Entity already deleted.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
delete:
  operationId: deleteClimbingRoute
  tags:
    - climbing-routes
  summary: Soft delete, idempotent.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Route.yaml'
