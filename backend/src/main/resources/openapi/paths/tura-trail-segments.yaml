get:
  operationId: listTrailSegmentsInBbox
  tags:
    - tura
  summary: >-
    Turistaút-szakaszok egy adott ország-kódra és bounding boxra (backlog/tura-utvonaltervezo/103-...
    1. fázis). Megosztott referenciaadat, nem user-owned, nem az /api/sync/changes csatornán megy.
  parameters:
    - name: country
      in: query
      required: true
      description: ISO 3166-1 alpha-2 országkód, pl. "HU".
      schema:
        type: string
    - name: minLon
      in: query
      required: true
      schema:
        type: number
    - name: minLat
      in: query
      required: true
      schema:
        type: number
    - name: maxLon
      in: query
      required: true
      schema:
        type: number
    - name: maxLat
      in: query
      required: true
      schema:
        type: number
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/TrailSegmentList.yaml'
