get:
  operationId: listWorkoutPlans
  tags:
    - workout-plans
  summary: Every live workout plan (deleted = false) owned by the caller — active and inactive alike — each with its live+tombstoned exercise/target-set rows.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/WorkoutPlanList.yaml'
post:
  operationId: createWorkoutPlan
  tags:
    - workout-plans
  summary: >-
    Create a plan with its exercises and target sets in one request — idempotent upsert on the
    client-supplied id (documentation/Architektúra/Backend-offline first.md §11 nested aggregate save).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/WorkoutPlan.yaml'
  responses:
    '200':
      description: Created or, on retry with the same id, the existing tree.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/WorkoutPlan.yaml'
    '400':
      description: An exercise or target-set is missing a required field.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
