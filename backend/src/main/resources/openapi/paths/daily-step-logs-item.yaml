parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  operationId: getDailyStepLog
  tags:
    - daily-step-logs
  summary: A single daily step log. Own deleted row returns 200 with deleted=true (not 404).
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/DailyStepLog.yaml'
    '404':
      description: No such daily step log (or it belongs to another user).
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
put:
  operationId: updateDailyStepLog
  tags:
    - daily-step-logs
  summary: Full update (last-write-wins). Max-wins is applied on the client, not here.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/DailyStepLog.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/DailyStepLog.yaml'
    '409':
      description: Entity already deleted.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
delete:
  operationId: deleteDailyStepLog
  tags:
    - daily-step-logs
  summary: Soft delete, idempotent.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/DailyStepLog.yaml'
