put:
  operationId: setUserPassword
  tags:
    - admin
  summary: Reset a user's password and revoke all of their refresh tokens (every device re-logs in).
  security:
    - adminApiKey: []
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/AdminSetPasswordRequest.yaml'
  responses:
    '204':
      description: Password changed, all refresh tokens revoked.
    '404':
      description: No such user.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
