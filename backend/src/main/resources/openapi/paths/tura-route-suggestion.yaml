get:
  operationId: suggestRoute
  tags:
    - tura
  summary: >-
    Automatikus útvonal-javaslat két pont közt a jelzett turistaút-hálózaton
    (backlog/tura-utvonaltervezo/103-... 2.2 fázis, saját A* a TrailSegment gráfon).
  parameters:
    - name: country
      in: query
      required: true
      description: ISO 3166-1 alpha-2 országkód, pl. "HU".
      schema:
        type: string
    - name: startLon
      in: query
      required: true
      schema:
        type: number
    - name: startLat
      in: query
      required: true
      schema:
        type: number
    - name: endLon
      in: query
      required: true
      schema:
        type: number
    - name: endLat
      in: query
      required: true
      schema:
        type: number
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/RouteSuggestion.yaml'
