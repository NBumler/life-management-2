parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  operationId: getClimbingGymColorBand
  tags:
    - climbing-gym-color-bands
  summary: A single colour band. Own deleted row returns 200 with deleted=true (not 404).
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/GymColorBand.yaml'
    '404':
      description: No such colour band (or it belongs to another user).
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
put:
  operationId: updateClimbingGymColorBand
  tags:
    - climbing-gym-color-bands
  summary: Full update (last-write-wins).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/GymColorBand.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/GymColorBand.yaml'
    '409':
      description: Entity already deleted, or the canonical hexColor collides with another live band of the gym.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
delete:
  operationId: deleteClimbingGymColorBand
  tags:
    - climbing-gym-color-bands
  summary: Soft delete, idempotent.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/GymColorBand.yaml'
