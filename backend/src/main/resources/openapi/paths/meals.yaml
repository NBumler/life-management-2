get:
  operationId: listMeals
  tags:
    - meals
  summary: Every live meal (deleted = false) owned by the caller, each with its live+tombstoned item rows.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/MealList.yaml'
post:
  operationId: createMeal
  tags:
    - meals
  summary: >-
    Create a meal with its items in one request — idempotent upsert on the client-supplied id
    (documentation/Architektúra/Backend-offline first.md §11 nested aggregate save).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/Meal.yaml'
  responses:
    '200':
      description: Created or, on retry with the same id, the existing tree.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Meal.yaml'
    '400':
      description: Zero live items, or an item missing its type-required fields.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
