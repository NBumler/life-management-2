get:
  operationId: listStretchSessions
  tags:
    - stretch-sessions
  summary: The caller's live stretching sessions (deleted = false), each with its live+tombstoned item rows.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/StretchSessionList.yaml'
post:
  operationId: createStretchSession
  tags:
    - stretch-sessions
  summary: >-
    Create a stretching session with its items in one request — idempotent upsert on the
    client-supplied id (documentation/Architektúra/Backend-offline first.md §11 nested aggregate save).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/StretchSession.yaml'
  responses:
    '200':
      description: Created or, on retry with the same id, the existing tree.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/StretchSession.yaml'
    '400':
      description: An item is missing a required field.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
