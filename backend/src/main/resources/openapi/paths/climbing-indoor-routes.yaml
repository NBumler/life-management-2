get:
  operationId: listClimbingIndoorRoutes
  tags:
    - climbing-indoor-routes
  summary: The caller's indoor-route catalogue, live rows only (deleted = false).
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/IndoorRouteList.yaml'
post:
  operationId: createClimbingIndoorRoute
  tags:
    - climbing-indoor-routes
  summary: Create an indoor route — idempotent upsert on the client-supplied id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/IndoorRoute.yaml'
  responses:
    '200':
      description: Created or, on retry with the same id, the existing row.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/IndoorRoute.yaml'
