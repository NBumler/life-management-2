parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  operationId: getSwimLog
  tags:
    - swim-logs
  summary: A single swim log. Own deleted row returns 200 with deleted=true (not 404).
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/SwimLog.yaml'
    '404':
      description: No such swim log (or it belongs to another user).
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
put:
  operationId: updateSwimLog
  tags:
    - swim-logs
  summary: Full update (last-write-wins).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/SwimLog.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/SwimLog.yaml'
    '400':
      description: Pool fields inconsistent (see POST).
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
    '409':
      description: Entity already deleted.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiError.yaml'
delete:
  operationId: deleteSwimLog
  tags:
    - swim-logs
  summary: Soft delete, idempotent.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../components/schemas/SwimLog.yaml'
