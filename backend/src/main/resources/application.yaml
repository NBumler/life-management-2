spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:lm2}
    username: ${POSTGRES_USER:lm2}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: true

# backlog/193 — a JSON-válaszok gzip-tömörítése: az ajánlott túrák listája (minden túra teljes vonala)
# és a turistaút-szakaszok bbox-lekérése nagy, jól tömöríthető JSON; a kliensek (WebView, böngésző)
# az Accept-Encoding alapján maguk bontják ki.
server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

lm2:
  jwt:
    secret: ${LM2_JWT_SECRET}
  admin:
    api-key: ${LM2_ADMIN_API_KEY}
