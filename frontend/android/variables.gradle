ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // documentation/Subfeatures/Lépésszám átszinkronizálása a Samsung Health-ből.md — the app-local
    // Health Connect plugin (health/HealthConnectStepsPlugin.kt) is the only Kotlin in the app module.
    kotlinVersion = '2.0.21'
    androidxHealthConnectVersion = '1.1.0'
    // documentation/Features/Értesítések.md "08:00 / 20:00 háttér-értesítés worker" — WorkManager runs
    // the ReminderWorker (notifications/) off the alarm broadcast so the async Health Connect read and
    // the notification post survive process death. work-runtime-ktx pulls kotlinx-coroutines too.
    androidxWorkVersion = '2.9.1'
    // Core library desugaring — androidx.health.connect and HealthConnectStepsPlugin.kt use java.time
    // (LocalDate/Instant/ZoneId), which is API 26+; minSdk is 24, so it must be backported.
    desugarJdkLibsVersion = '2.1.5'
}