<app-help-input
  [label]="label"
  [value]="text()"
  [placeholder]="placeholder || (placeholderKey | translate)"
  [disabled]="disabled()"
  helpTitleKey="SHARED.QUANTITY_INPUT.HELP_TITLE"
  [helpTextKey]="helpTextKey"
  [errorKey]="errorMessage()"
  (valueChange)="onInput($event)"
  (blurred)="onBlur()"
/>
