@if (isNative) {
  <ion-list>
    @for (item of items; track item.id; let i = $index) {
      <ion-item>
        @if (itemTemplate) {
          <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item, index: i }"></ng-container>
        } @else {
          <ion-label>{{ item.label }}</ion-label>
        }
        <div class="reorder-arrows" slot="end">
          <ion-button
            class="reorder-arrow"
            fill="outline"
            size="small"
            color="medium"
            [disabled]="i === 0"
            [attr.aria-label]="'COMMON.MOVE_UP' | translate"
            (click)="moveUp(i)"
          >
            <ion-icon name="chevron-up-outline" slot="icon-only" aria-hidden="true"></ion-icon>
          </ion-button>
          <ion-button
            class="reorder-arrow"
            fill="outline"
            size="small"
            color="medium"
            [disabled]="i === items.length - 1"
            [attr.aria-label]="'COMMON.MOVE_DOWN' | translate"
            (click)="moveDown(i)"
          >
            <ion-icon name="chevron-down-outline" slot="icon-only" aria-hidden="true"></ion-icon>
          </ion-button>
        </div>
        <ion-button slot="end" fill="clear" color="danger" [attr.aria-label]="'COMMON.REMOVE' | translate" (click)="remove.emit(item)">
          <ion-icon name="close-outline" slot="icon-only" aria-hidden="true"></ion-icon>
        </ion-button>
      </ion-item>
    }
  </ion-list>
} @else {
  <ion-list>
    <ion-reorder-group [disabled]="false" (ionItemReorder)="onIonReorder($event)">
      @for (item of items; track item.id; let i = $index) {
        <ion-item>
          @if (itemTemplate) {
            <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item, index: i }"></ng-container>
          } @else {
            <ion-label>{{ item.label }}</ion-label>
          }
          <ion-button fill="clear" color="danger" (click)="remove.emit(item)">
            <ion-icon name="close-outline" slot="icon-only" aria-hidden="true"></ion-icon>
          </ion-button>
          <ion-reorder slot="end"></ion-reorder>
        </ion-item>
      }
    </ion-reorder-group>
  </ion-list>
}
