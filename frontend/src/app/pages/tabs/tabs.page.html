<ion-tabs>
  <!-- @ionic/angular's IonTabs component renders its own internal, router-wired
       <ion-router-outlet> — adding another one here duplicates it. The duplicate never gets
       activated by the router (stays empty) but still absolutely-positions itself over the whole
       tab area and intercepts every tap before it reaches the real page underneath. -->
  <ion-tab-bar slot="bottom">
    @for (tab of enabledTabs; track tab.key) {
      <ion-tab-button [tab]="tab.key" [href]="tab.route">
        <ion-icon [name]="tab.icon" aria-hidden="true"></ion-icon>
        <ion-label>{{ tab.labelKey | translate }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
