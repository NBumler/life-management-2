<ion-tabs>
  <ion-router-outlet></ion-router-outlet>
  <ion-tab-bar slot="bottom">
    @for (tab of enabledTabs; track tab.key) {
      <ion-tab-button [tab]="tab.key" [href]="tab.route">
        <ion-icon [name]="tab.icon" aria-hidden="true"></ion-icon>
        <ion-label>{{ tab.labelKey | translate }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
