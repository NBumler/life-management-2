<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/menu/steps"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'STEPS.EDIT_TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item>
      <ion-input
        type="date"
        [max]="todayIso"
        label="{{ 'STEPS.DATE' | translate }}"
        labelPlacement="stacked"
        [ngModel]="date()"
        (ngModelChange)="onDateChange($event)"
        [ngModelOptions]="{ standalone: true }"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        type="number"
        inputmode="numeric"
        min="0"
        label="{{ 'STEPS.STEP_COUNT' | translate }}"
        labelPlacement="stacked"
        [ngModel]="stepCount()"
        (ngModelChange)="setStepCount($event)"
        [ngModelOptions]="{ standalone: true }"
        [placeholder]="'STEPS.STEP_COUNT_PLACEHOLDER' | translate"
      ></ion-input>
    </ion-item>
  </ion-list>

  <div class="ion-padding">
    <ion-button expand="block" [disabled]="!canSave || saving()" (click)="save()">
      {{ 'STEPS.SAVE' | translate }}
    </ion-button>
    @if (existingRow() !== null) {
      <ion-button expand="block" fill="clear" color="danger" (click)="delete()">
        {{ 'STEPS.DELETE' | translate }}
      </ion-button>
    }
  </div>
</ion-content>
