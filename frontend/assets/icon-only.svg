  <rect width="1024" height="1024" fill="#3880ff"/>
  <g fill="#ffffff" fill-opacity="0.72">
    <rect x="100" y="100" width="470" height="470" rx="104" ry="104"/>
    <rect x="277" y="277" width="470" height="470" rx="104" ry="104"/>
    <rect x="454" y="454" width="470" height="470" rx="104" ry="104"/>
  </g>
