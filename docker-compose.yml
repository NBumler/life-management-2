services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18's image switched to pg_ctlcluster-style versioned data dirs and now refuses to
      # start against a volume mounted at the old .../postgresql/data path — mount the parent instead.
      - lm2_postgres_data:/var/lib/postgresql

volumes:
  lm2_postgres_data:
